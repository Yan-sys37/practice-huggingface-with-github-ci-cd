name: Train and Upload to Hugging Face

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  train-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train model
        run: python train.py

      - name: Upload to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          import os
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          repo_id = "Yan-sys37/imdb-sentiment-analysis"
          api = HfApi()

          api.create_repo(repo_id, token=token, exist_ok=True)

          # 这里的文件名，必须和train.py里保存的文件名完全一致！
          files = ["model.h5", "tfidf.pkl", "train.py", "requirements.txt"]
          for filename in files:
              if os.path.exists(filename):
                  api.upload_file(
                      path_or_fileobj=filename,
                      path_in_repo=filename,
                      repo_id=repo_id,
                      token=token,
                  )
                  print(f"Uploaded {filename}")
              else:
                  print(f"WARNING: File not found: {filename}")

          print(f"✅ 模型已上传至: https://huggingface.co/{repo_id}")
        shell: python
