name: Train and Upload to Hugging Face

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  train-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train model
        run: python train.py

      - name: Upload to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          import os
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          repo_id = "Yan-sys37/imdb-sentiment-analysis"
          api = HfApi()

          api.create_repo(repo_id, token=token, exist_ok=True)

          # 版本A用这组
          # files = ["imdb_sentiment_model.h5", "tfidf_vectorizer.pkl", "train.py", "requirements.txt"]
          
          # 版本B用这组
          files = ["imdb_glove_model.h5", "tokenizer.pkl", "train.py", "requirements.txt"]

          for filename in files:
              api.upload_file(
                  path_or_fileobj=filename,
                  path_in_repo=filename,
                  repo_id=repo_id,
                  token=token,
              )
              print(f"Uploaded {filename}")

          print(f"✅ 模型已上传至: https://huggingface.co/{repo_id}")
        shell: python
