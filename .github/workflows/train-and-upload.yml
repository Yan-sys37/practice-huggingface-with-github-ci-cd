name: IMDB Sentiment Analysis

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train model
        run: python train.py

      - name: Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          from huggingface_hub import HfApi
          import os
          api = HfApi()
          token = os.environ["HF_TOKEN"]
          repo_id = "Yanany/imdb-sentiment-model"

          api.create_repo(repo_id, token=token, exist_ok=True)
          api.upload_file(
              path_or_fileobj="imdb_sentiment_model.h5",
              path_in_repo="imdb_sentiment_model.h5",
              repo_id=repo_id,
              token=token
          )
          EOF
